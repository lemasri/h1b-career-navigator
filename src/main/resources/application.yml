spring:
  application:
    name: h1b-career-navigator

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/h1b_navigator}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema — never let JPA auto-create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour TTL for visa data
      cache-null-values: false

# AWS Configuration
aws:
  region: ${AWS_REGION:us-west-2}  # Washington state → us-west-2
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:}
  sqs:
    queue-url: ${AWS_SQS_QUEUE_URL:}
  bedrock:
    model-id: ${AWS_BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-in-production}
  expiration-ms: 86400000  # 24 hours

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      sns-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        # Lesson learned: SNS can have regional outages.
        # Circuit breaker prevents cascading failures.
        # See POSTMORTEM.md Mistake #2
      bedrock-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 40

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.navigator: INFO
    org.springframework.security: WARN
    software.amazon.awssdk: WARN
